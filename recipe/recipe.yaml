schema_version: 1

context:
  name: plasticparcels
  version: "0.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/oceanparcels/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: 00a3b3aa3ce67c2c72aeaefd92730f3bc20040962a643d816ecc85306ab80665

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools_scm >=8
    - wheel
  run:
    - python >=${{ python_min }}
    - parcels >=3.0.2
    - copernicusmarine
    - shapely
    - geopandas

tests:
  - python:
      imports:
        - plasticparcels
      pip_check: false # TODO: Change to true once https://github.com/OpenDrift/trajan/pull/241 is merged, and trajan has new release

      python_version:
        - ${{ python_min }}.*
        - "*"
about:
  summary: Ready-to-use tool for plastic dispersion simulations and parameterisation development
  description: |
    plasticparcels is a python package for simulating the transport and dispersion of plastics in the ocean.
    The tool is based on the parcels computational Lagrangian ocean analysis framework,
    providing a modular and customisable collection of methods, notebooks, and tutorials
    for advecting virtual plastic particles with a wide range of physical properties.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/OceanParcels/plasticparcels
  repository: https://github.com/OceanParcels/plasticparcels
  documentation: https://plastic.oceanparcels.org

extra:
  recipe-maintainers:
    - erikvansebille
    - michaeldenes
